
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Between Worlds</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #050006;
            overflow: hidden;
        }

        #gameWorld {
            background: white;
            border: 1px solid black;
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }

        /* ---------- Loading screen ---------- */
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050006;
            overflow: hidden;
            transition: opacity 0.7s ease;
        }

        #loadingScreen.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loadingScreen::before {
            /* ambient split-dimension glow: magenta (dream) / cyan (real) */
            content: "";
            position: absolute;
            inset: -20%;
            background:
                radial-gradient(circle at 25% 30%, rgba(232, 121, 249, 0.16), transparent 55%),
                radial-gradient(circle at 75% 70%, rgba(34, 211, 238, 0.12), transparent 55%);
            animation: loading-drift 9s ease-in-out infinite alternate;
        }

        #loadingScreen::after {
            /* CRT scanlines */
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.22) 0,
                rgba(0, 0, 0, 0.22) 1px,
                transparent 1px,
                transparent 4px
            );
            opacity: 0.35;
            pointer-events: none;
        }

        @keyframes loading-drift {
            from { transform: translate(-1.5%, -1%) scale(1); }
            to   { transform: translate(1.5%, 1.5%) scale(1.04); }
        }

        .loading-title {
            position: relative;
            margin: 0;
            font-family: "Orbitron", sans-serif;
            font-weight: 700;
            font-size: clamp(2.6rem, 6.5vw, 5.5rem);
            letter-spacing: 0.04em;
            color: #f5f0ff;
            text-shadow: 0 0 28px rgba(192, 132, 252, 0.55);
        }

        .loading-title::before,
        .loading-title::after {
            content: "BETWEEN WORLDS";
            position: absolute;
            inset: 0;
            opacity: 0.75;
            animation: loading-flicker 3.4s infinite steps(1);
        }

        .loading-title::before {
            color: #22d3ee;
            transform: translate(-2px, 0);
            animation-delay: 0.15s;
        }

        .loading-title::after {
            color: #e879f9;
            transform: translate(2px, 0);
        }

        @keyframes loading-flicker {
            0%, 92%, 100% { opacity: 0; }
            94% { opacity: 0.8; }
            96% { opacity: 0; }
            98% { opacity: 0.6; }
        }

        .loading-tagline {
            position: relative;
            margin: 0.9rem 0 3.2rem;
            font-family: "Oxanium", sans-serif;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.6vw, 1rem);
            letter-spacing: 0.25em;
            color: rgba(216, 180, 254, 0.55);
        }

        .loading-bar-track {
            position: relative;
            width: min(70vw, 460px);
            height: 3px;
            background: rgba(192, 132, 252, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22d3ee, #e879f9);
            box-shadow: 0 0 12px rgba(232, 121, 249, 0.7);
            animation: loading-fill 2.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        @keyframes loading-fill {
            0%   { width: 0%; }
            60%  { width: 78%; }
            100% { width: 96%; }
        }

        .loading-status {
            position: relative;
            margin-top: 1rem;
            font-family: "Oxanium", sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: rgba(216, 180, 254, 0.7);
        }

        @media (prefers-reduced-motion: reduce) {
            #loadingScreen::before,
            .loading-title::before,
            .loading-title::after,
            .loading-bar-fill {
                animation: none;
            }
            .loading-bar-fill {
                width: 96%;
            }
        }
    </style>

    <script type="module" src="./main.js"></script>
</head>
<body>
    <div id="loadingScreen">
        <h1 class="loading-title">BETWEEN WORLDS</h1>
        <p class="loading-tagline">SLIPPING BETWEEN THE REAL AND THE DREAM</p>
        <div class="loading-bar-track">
            <div class="loading-bar-fill" id="loadingBarFill"></div>
        </div>
        <p class="loading-status">ENTERING THE DREAM&hellip;</p>
    </div>
    <canvas id="gameWorld" width="1920" height="1080" tabindex="0" autofocus></canvas>
</body>
</html>
